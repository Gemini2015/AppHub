name: verify

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: verify (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # 不传 version：由 package.json 的 packageManager 字段决定 pnpm 版本，
      # 避免 "Multiple versions of pnpm specified" 冲突。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 全部包 test + typecheck + desktop build + 真实 Electron E2E
      - name: Verify (tests + typecheck + build + e2e)
        run: pnpm verify:e2e

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-windows
          path: apps/desktop/e2e/.tmp
          retention-days: 7
          if-no-files-found: ignore

  linux:
    name: verify (Linux, xvfb)
    # 固定到 Ubuntu 24.04：ubuntu-latest 将在 2026-10 迁移到 Ubuntu 26，
    # 固定版本可避免迁移期依赖包名/系统库变化导致的随机失败。
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Electron/Chromium runtime libraries
        run: |
          sudo apt-get update
          # Ubuntu 24.04+ 将部分库改为 t64 命名；按可用性选择，兼容旧 runner。
          if apt-cache show libasound2t64 >/dev/null 2>&1; then
            EXTRA="libasound2t64 libatk-bridge2.0-0t64 libgtk-3-0t64"
          else
            EXTRA="libasound2 libatk-bridge2.0-0 libgtk-3-0"
          fi
          sudo apt-get install -y \
            xvfb libnss3 libgbm1 libxss1 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libxkbcommon0 libpango-1.0-0 libcairo2 $EXTRA

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron 无头运行需要 xvfb；CI 容器/root 环境需要 --no-sandbox，
      # 无 GPU 的 runner 加 --disable-gpu 提升稳定性。
      - name: Verify (tests + typecheck + build + e2e)
        run: xvfb-run -a pnpm verify:e2e
        env:
          APPHUB_E2E_ELECTRON_ARGS: --no-sandbox --disable-gpu
          ELECTRON_DISABLE_SANDBOX: 1

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-linux
          path: apps/desktop/e2e/.tmp
          retention-days: 7
          if-no-files-found: ignore
